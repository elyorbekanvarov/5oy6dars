    <link rel="stylesheet" href="./styles/style.css" />
    <title>6-dars</title>

  <body>
    <header class="container">
      <h1>Where in the world?</h1>
      <a href="#" id="dark">
        <img
          id="moon"
          src="./images/moon.svg"
          alt="moon"
          width="20"
          height="20"
        />
        <img id="sun" class="hidden" src="./images/sun.svg" alt="sun" width="20" height="20" />
        <span>Dark Mode</span>
      </a>
    </header>
    <main class="container">
      <div class="input-and-filter">
        <div class="input">
          <img class="search" src="./images/search.svg" alt="search" width="18" height="18" />
          <img class="search-white hidden" src="./images/search-white.svg" alt="search" width="18" height="18">
          <input type="search" placeholder="Search for a country…" />
        </div>
        <select class="filter" name="filter" id="filter">
          <option value="filter" selected>Filter By Region</option>
          <option value="africa">Africa</option>
          <option value="america">America</option>
          <option value="asia">Asia</option>
          <option value="europe">Europe</option>
          <option value="oceania">Oceania</option>
        </select>
      </div>
