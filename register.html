<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>register</title>
  </head>
  <body>
    <div class="wrapper">
      <span>← Back to home</span>
      <form id="form">
        <div class="head">
          <div class="p">
            <img src="./images/Text.png" alt="text" width="14.19" height="32" />
          </div>
          <span>Create Account</span>
          <p>Join us today</p>
        </div>
        <div class="body">
          <div class="input name" id="inputName">
            <img
              src="./images/person.svg"
              alt="person"
              width="20"
              height="20"
            />
            <input required type="text" placeholder="Full name" />
          </div>
          <div class="input email" id="inputEmail">
            <img src="./images/email.svg" alt="email" width="20" height="20" />
            <input required type="email" placeholder="Email address" />
          </div>
          <div class="input password" id="inputPassword">
            <img src="./images/qulf.svg" alt="qulf" width="20" height="20" />
            <input type="password" placeholder="Password" required />
          </div>
          <div class="super-btn">
            <button type="submit">Create Account</button>
          </div>
        </div>
        <div class="or">
          <div class="chiziq"></div>
          <span>or</span>
          <div class="chiziq"></div>
        </div>
        <div class="magic-btn">
          <button type="button">
            <img
              src="./images/chrome.svg"
              alt="chrome"
              width="20"
              height="20"
            />
            <span>Register with Google</span>
          </button>
        </div>
        <div class="login">
          <span>Already have an account?</span>
          <a target="_blank" href="./login.html">Log in</a>
        </div>
      </form>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
